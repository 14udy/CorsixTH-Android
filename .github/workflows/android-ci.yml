name: Android CI (debug APK)

# Builds an installable debug APK with no secrets needed.
# Download it from the run's "Artifacts" section.

on:
  push:
    branches:
      - 'dev'
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    - name: set up JDK 18
      uses: actions/setup-java@v4
      with:
        java-version: '18'
        distribution: 'temurin'
        cache: gradle
    - name: Write placeholder Firebase config
      # Firebase is built into the app; a fake config lets it build and simply do nothing.
      run: |
        cat > google-services.json <<'EOF'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "corsixth-local",
            "storage_bucket": "corsixth-local.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "uk.co.armedpineapple.cth" }
              },
              "oauth_client": [],
              "api_key": [ { "current_key": "AIzaSyDummyKeyForLocalBuildsOnly0000000" } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }
          ],
          "configuration_version": "1"
        }
        EOF
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build debug APK
      run: ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CorsixTH-debug-apk
        path: build/outputs/apk/debug/*.apk
